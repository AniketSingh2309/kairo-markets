[project]
name = "ai-stock-analyser"
version = "0.1.0"
description = "Multi-agent stock analysis on Agno + Groq (Llama 3.3 70B) with a strict tool contract and grounded, cited answers"
requires-python = ">=3.11"
dependencies = [
    "agno>=2.0,<3.0",
    "groq>=0.13",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7,<3.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "websockets>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
